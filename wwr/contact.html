<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Luis Navarrete">
    <meta name="description"
        content="Contact Sivar Rafting Company for inquiries about our river trips. Call us, email us, or send a message to book your next adventure today">
    <title>Contact Us | Sivar Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo.png" alt="Sivar Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Sivar Rafting</h1>
        <div class="company-info">
            <address>
                123 Rio Lempa Blvd<br>
                San Salvador, El Salvador<br>
                Phone: (503) 2222-2222<br>
                Email: info@sivarrafting.com
            </address>
        </div>
        <div class="contact-container">

            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d247760.67068011567!2d-89.03563677439512!3d14.002563262140225!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f62e20d069aa36d%3A0xc3fef37a65b6f109!2sRio%20Lempa!5e0!3m2!1sen!2ssv!4v1764811983435!5m2!1sen!2ssv"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="form-container">

                <form action="#" method="get">

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>

                    <label>Message Purpose:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general" id="general"> General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation" id="reservation"> Reservation
                            Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="website" id="suggestion"> Website Suggestion
                        </label>
                    </div>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type your message here..."></textarea>

                    <div class="newsletter">
                        <label>
                            <input type="checkbox" name="newsletter" id="newsletter"> Please subscribe me to the monthly
                            newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>

                </form>
            </div>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/rafting1.jpg" alt="Juan Perez Profile">
                    <figcaption>Juan Pérez <br> Master Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting2.jpg" alt="Maria Lopez Profile">
                    <figcaption>Maria López <br> Safety Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting3.jpg" alt="Carlos Ruiz Profile">
                    <figcaption>Carlos Ruiz <br> Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 🌴 Sivar Rafting 🌴 Luis Navarrete</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
